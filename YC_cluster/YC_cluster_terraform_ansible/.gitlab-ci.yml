stages:
  - test
  - build
  - publish

variables:
  # Флаг для Docker-in-Docker
  DOCKER_TLS_CERTDIR: ""
  # Токен и URL SonarQube нужно задать в GitLab CI/CD Variables
  # SONAR_HOST_URL: "https://sonarqube.<вашдомен>"
  # SONAR_TOKEN: "<сгенерированный_токен>"

# ==============================================================================
# 0. Проверка кода в SonarQube
# ==============================================================================
sonarqube-check:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
      -Dsonar.projectKey=service-main
      -Dsonar.sources=.
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.qualitygate.wait=true
  only:
    - main
    - master

# ==============================================================================
# 1. Сборка и Push образа в Yandex Container Registry
# ==============================================================================
build_image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - |
      if [ -f "$YC_SA_JSON_KEY" ]; then
        KEY_CONTENT=$(cat "$YC_SA_JSON_KEY")
      else
        KEY_CONTENT="$YC_SA_JSON_KEY"
      fi

      AUTH_BASE64=$(printf "json_key:%s" "$KEY_CONTENT" | base64 | tr -d '\n')
      echo "{\"auths\":{\"cr.yandex\":{\"auth\":\"$AUTH_BASE64\"}}}" > /kaniko/.docker/config.json

    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/service-main"
      --dockerfile "Dockerfile"
      --destination "${REGISTRY_URL}/service-main:${CI_COMMIT_SHORT_SHA}"
      --destination "${REGISTRY_URL}/service-main:latest"
      --cache=true
      --cache-repo "${REGISTRY_URL}/cache"

  only:
    - main
    - master

# ==============================================================================
# 2. Запись версии релиза в Consul Key/Value
# ==============================================================================
publish_version:
  stage: publish
  image: curlimages/curl:latest
  script:
    # Записываем тег коммита в ключ release_version в Consul
    - |
      curl --fail --request PUT \
        --data "$CI_COMMIT_SHORT_SHA" \
        "http://51.250.109.15:8500/v1/kv/release_version"
    - echo "Релиз версии $CI_COMMIT_SHORT_SHA успешно опубликован в Consul!"
  only:
    - master
default:
  tags:
    - ext
